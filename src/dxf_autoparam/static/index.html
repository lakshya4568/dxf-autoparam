<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DXF Parametrizer</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --struct: #111827; --anno: #8b95a3; --ref: #dc2626; --fixed: #c7ccd4; --fill: rgba(99,102,241,.10); --ghost: rgba(37,99,235,.35);
    --hi: #ea580c; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --accent: #2563eb; --chip: #eef2ff; --ai: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #171a21; --ink: #e5e7eb; --muted: #9ca3af; --line: #2a2f3a;
      --struct: #e5e7eb; --anno: #6b7280; --ref: #f87171; --fixed: #3b4250; --fill: rgba(129,140,248,.14); --ghost: rgba(96,165,250,.45);
      --hi: #fb923c; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --accent: #60a5fa; --chip: #1e2537; --ai: #a78bfa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 6px 0 0; }
  .file { color: var(--muted); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button, select, .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.ai { background: var(--ai); color: #fff; border-color: var(--ai); }
  button.stop { background: var(--bad); color: #fff; border-color: var(--bad); }
  button.small { padding: 1px 7px; font-size: 11px; }
  button:disabled { opacity: .55; cursor: wait; }
  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 470px; min-width: 320px; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; border-radius: 0; flex: 1; padding: 8px 2px; background: transparent; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .pane { overflow: auto; padding: 10px 12px; flex: 1; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .row { display: grid; grid-template-columns: 18px 1fr 140px; gap: 6px; align-items: center; padding: 4px 6px; border-radius: 6px; }
  .row.off { opacity: .55; }
  .val { display: flex; align-items: center; gap: 4px; }
  .row:hover, .node:hover { background: var(--chip); }
  .row .nm { min-width: 0; }
  .row .nm b { font-weight: 600; cursor: pointer; }
  .sub { color: var(--muted); font-size: 11px; }
  .row .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row input[type=number] { width: 108px; font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); color: var(--ink); text-align: right; }
  .row input.changed { border-color: var(--hi); }
  .more { grid-column: 2 / 4; padding: 4px 0 6px; }
  .sweep { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .unit { color: var(--muted); font-size: 11px; }
  .chip { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 9px; margin-left: 4px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .chip.ai { color: var(--ai); } .chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); }
  .node { padding: 3px 6px; border-radius: 6px; display: flex; align-items: flex-start; gap: 6px; }
  .node .body { flex: 1; min-width: 0; }
  .rel { padding: 4px 6px; border-bottom: 1px dashed var(--line); }
  .rel code { font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; margin: 3px 0; }
  .f-error { color: var(--bad); } .f-warn { color: var(--warn); }
  .st-confirmed, .st-always { color: var(--ok); } .st-contradicted, .st-false, .st-rejected { color: var(--bad); } .st-now_only { color: var(--warn); } .st-held, .st-unchecked { color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); margin: 6px 0; }
  .canvas { flex: 1; position: relative; min-width: 0; }
  svg { width: 100%; height: 100%; display: block; background: var(--bg); cursor: grab; }
  .toolbar { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .hint { position: absolute; left: 10px; top: 10px; color: var(--muted); font-size: 12px; background: var(--panel); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); }
  .banner { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 8px 12px; border-radius: 6px; background: var(--panel); border: 1px solid var(--bad); color: var(--bad); display: none; }
  .busy { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.25); color: #fff; font-size: 15px; }
  .empty { padding: 30px; color: var(--muted); }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
  textarea { width: 100%; min-height: 96px; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); resize: vertical; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
  .chips button { font-size: 11px; padding: 1px 8px; border-radius: 10px; }
  .stream { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; max-height: 46vh; overflow: auto; background: var(--bg); }
  .ev { padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: 12px; }
  .ev.thought { color: var(--ink); white-space: pre-wrap; }
  .ev.call { color: var(--ai); font-weight: 600; }
  .ev.round { color: var(--ok); } .ev.err { color: var(--bad); } .ev.retry { color: var(--warn); }
  .ev .t { color: var(--muted); font-size: 10px; margin-right: 6px; }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ai); margin-right: 6px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  #world text[data-r] { cursor: pointer; }
  @media (max-width: 760px) { main { flex-direction: column; } aside { width: 100%; height: 50%; } .hint { display: none; } }
</style>
</head>
<body>
<header>
  <h1>DXF → Parametric</h1>
  <span class="file" id="file">no drawing</span>
  <label class="btn">Open DXF<input type="file" id="open" accept=".dxf" hidden /></label>
  <select id="views" title="Parametrize one view of a sheet at a time"></select>
  <button id="ai" class="ai" title="Gemini segments the drawing into parts, names the values, states what grows and what stays; the engine measures every claim">✨ Parametrize with Gemini</button>
  <button id="geo" title="Only the deterministic geometry engine (regions and generic names)">Geometry only</button>
  <label class="btn" id="holdwrap" title="Existing structures (e.g. the old bridge beside a doubling) are parametric too; tick to keep them exactly as drawn">
    <input type="checkbox" id="hold" /> Hold existing fixed</label>
  <span style="flex:1"></span>
  <button id="reset">Reset values</button>
  <button id="cadjson" title="The drawing as the AI sees it: entities, regions, relationships, datums">CAD JSON</button>
  <button id="json">Program JSON</button>
  <button id="answer" title="Gemini's answer as validated — re-open later with: dxf-autoparam serve drawing.dxf --answer file.json">AI answer</button>
  <label class="btn" title="Upload the same drawing after a designer changed it: the engine learns what was edited, what grew and what stayed">Learn from edit<input type="file" id="learn" accept=".dxf" hidden /></label>
  <button id="export" class="primary">Export DXF</button>
</header>
<main>
  <aside>
    <div class="tabs">
      <button data-tab="gemini">Gemini</button>
      <button data-tab="struct" class="on">Structure</button>
      <button data-tab="params">Parameters</button>
      <button data-tab="intent">Intent</button>
      <button data-tab="rels">Relations</button>
      <button data-tab="valid">Validation</button>
    </div>
    <div class="pane" id="pane"><div class="empty">Open a DXF to begin.</div></div>
  </aside>
  <section class="canvas">
    <svg id="svg"><g id="world"></g><rect id="sel" fill="rgba(37,99,235,.08)" stroke="#2563eb" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" display="none"/></svg>
    <div class="hint">drag: pan · wheel: zoom · shift+drag: pick a region</div>
    <div class="toolbar">
      <label class="btn"><input type="checkbox" id="ghost" checked /> original</label>
      <label class="btn"><input type="checkbox" id="showRegions" /> regions</label>
      <button id="fit">Fit</button><button id="useSel" class="primary" style="display:none">Use this region</button><button id="whole">Whole sheet</button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="busy" id="busy">Working…</div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let S = null, values = {}, geom = [], geom0 = [], relVals = [], tab = "struct", view = { x: 0, y: 0, w: 1, h: 1 }, sel = null, fitted = false;
let hold = new Set(), exclude = new Set(), drop = new Set(), open = new Set(), lesson = null;
let job = { running: false, events: [], next: 0 }, poller = null, draft = null;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (j && j.ok === false && j.error) throw new Error(j.error);
  return j;
}
function busy(on, text) { $("#busy").style.display = on ? "flex" : "none"; $("#busy").textContent = text || "Working…"; document.querySelectorAll("header button").forEach((b) => (b.disabled = on)); }
function banner(msg, ok = false) { const b = $("#banner"); b.style.display = "block"; b.style.borderColor = ok ? "var(--ok)" : "var(--bad)"; b.style.color = ok ? "var(--ok)" : "var(--bad)"; b.textContent = msg; setTimeout(() => (b.style.display = "none"), ok ? 3000 : 9000); }

async function load() {
  S = await api("/api/state");
  if (S.empty) return;
  values = { ...S.values }; geom = S.geometry; relVals = S.relation_values;
  const atDefaults = S.parameters.every((p) => Math.abs((values[p.name] ?? p.value) - p.value) < 1e-9);
  if (atDefaults) geom0 = geom;
  const sl = S.selection || {};
  hold = new Set(sl.hold || []); exclude = new Set(sl.exclude || []); drop = new Set(sl.drop || []);
  $("#file").textContent = S.file + (S.region ? " · region" : "");
  $("#hold").checked = !!S.hold_existing;
  $("#holdwrap").style.display = S.components.some((c) => c.existing) ? "" : "none";
  $("#answer").style.display = S.mode === "ai" ? "" : "none";
  $("#views").innerHTML = '<option value="">Whole sheet</option>' + S.views.slice(0, 25).map((v) => `<option value="${v.id}">View ${v.id + 1} · ${v.entities} entities</option>`).join("");
  if (draft === null) draft = S.instructions || "";
  draw();
  if (!fitted) { fit(); fitted = true; }
  render();
  if (S.ai_job && S.ai_job.running && !poller) { job.stopping = S.ai_job.stopping; watch(); }
}

// ── canvas ──────────────────────────────────────────────────────────────────
let textSize = 100;
function bounds(g) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of g) { if (p.role === "fixed") continue; for (const q of p.pts || (p.at ? [p.at] : [])) { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); } }
  return [x0, y0, x1, y1];
}
function poly(p, col, width, dash) {
  const el = document.createElementNS(NS, p.closed ? "polygon" : "polyline");
  el.setAttribute("points", p.pts.map((q) => q[0] + "," + q[1]).join(" "));
  el.setAttribute("fill", "none"); el.setAttribute("stroke", col); el.setAttribute("vector-effect", "non-scaling-stroke");
  el.setAttribute("stroke-width", width); if (dash) el.setAttribute("stroke-dasharray", dash);
  return el;
}
function draw(hl = new Set()) {
  const g = $("#world"); g.innerHTML = "";
  const [bx0, by0, bx1, by1] = bounds(geom); textSize = Math.max(bx1 - bx0, by1 - by0) * 0.010 || 100;
  const frag = document.createDocumentFragment();
  if ($("#ghost").checked && geom0 !== geom) for (const p of geom0) if (p.k === "p" && p.role === "structural") frag.appendChild(poly(p, "var(--ghost)", 0.9, "6 4"));
  for (const p of geom) {
    const h = hl.has(p.i);
    const col = h ? "var(--hi)" : p.role === "structural" ? "var(--struct)" : p.role === "reference" ? "var(--ref)" : p.role === "fixed" ? "var(--fixed)" : "var(--anno)";
    if (p.k === "p") frag.appendChild(poly(p, col, h ? 2.4 : p.role === "structural" ? 1.2 : 0.7, p.role === "reference" ? "10 4 2 4" : null));
    else if (p.k === "g") {
      const el = document.createElementNS(NS, "polygon");
      el.setAttribute("points", p.pts.map((q) => q[0] + "," + q[1]).join(" "));
      el.setAttribute("fill", h ? "rgba(234,88,12,.18)" : "var(--fill)"); el.setAttribute("stroke", "none");
      frag.appendChild(el);
    } else if (p.k === "t" && p.text) {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("transform", `translate(${p.at[0]},${p.at[1]}) rotate(${p.rot || 0}) scale(1,-1)`);
      t.setAttribute("font-size", p.h || textSize * 0.8); t.setAttribute("fill", h ? "var(--hi)" : "var(--muted)");
      if (p.dim) { t.setAttribute("text-anchor", "middle"); t.setAttribute("dy", "-0.3em"); }
      t.textContent = p.text.replace(/\\P/g, " ");
      frag.appendChild(t);
    }
  }
  if ($("#showRegions").checked && S) for (const r of S.regions) {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("transform", `translate(${r.inside[0]},${r.inside[1]}) scale(1,-1)`);
    t.setAttribute("font-size", Math.max(textSize * 0.9, Math.min(r.width, r.height) * 0.25)); t.setAttribute("fill", "var(--accent)"); t.setAttribute("text-anchor", "middle");
    t.textContent = r.id; t.setAttribute("data-r", r.id); frag.appendChild(t);
  }
  g.appendChild(frag); g.setAttribute("transform", "scale(1,-1)"); setVB();
}
function fit() {
  const [x0, y0, x1, y1] = S && S.region ? S.region : bounds(geom);
  const pad = 0.05 * Math.max(x1 - x0, y1 - y0);
  view = { x: x0 - pad, y: -(y1 + pad), w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad }; setVB();
}
function setVB() { $("#svg").setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`); }
function toWorld(ev) { const svg = $("#svg"); const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse()); return [p.x, -p.y]; }
(() => {
  const svg = $("#svg"); let drag = null;
  svg.addEventListener("wheel", (ev) => { ev.preventDefault(); const [wx, wy] = toWorld(ev); const k = ev.deltaY > 0 ? 1.15 : 1 / 1.15; view = { x: wx - (wx - view.x) * k, y: -wy - (-wy - view.y) * k, w: view.w * k, h: view.h * k }; setVB(); }, { passive: false });
  svg.addEventListener("pointerdown", (ev) => { svg.setPointerCapture(ev.pointerId); drag = { shift: ev.shiftKey, start: toWorld(ev), sx: ev.clientX, sy: ev.clientY, v: { ...view } }; });
  svg.addEventListener("pointermove", (ev) => {
    if (!drag) return;
    if (drag.shift) { const [x, y] = toWorld(ev), [a, b] = drag.start; sel = [Math.min(a, x), Math.min(b, y), Math.max(a, x), Math.max(b, y)]; const r = $("#sel"); r.setAttribute("display", "inline"); r.setAttribute("x", sel[0]); r.setAttribute("y", -sel[3]); r.setAttribute("width", sel[2] - sel[0]); r.setAttribute("height", sel[3] - sel[1]); }
    else { const rect = svg.getBoundingClientRect(); const s = Math.max(view.w / rect.width, view.h / rect.height); view = { ...drag.v, x: drag.v.x - (ev.clientX - drag.sx) * s, y: drag.v.y - (ev.clientY - drag.sy) * s }; setVB(); }
  });
  svg.addEventListener("pointerup", () => { drag = null; $("#useSel").style.display = sel ? "" : "none"; });
})();

// ── panels ──────────────────────────────────────────────────────────────────
const fmt = (v, unit) => unit === "m" ? Number(v).toFixed(3) : (Math.round(Number(v) * 10) / 10).toString();
const conf = (c) => c == null ? "" : `<span class="chip ${c >= 0.85 ? "ok" : c >= 0.75 ? "" : "warn"}" title="the AI's confidence">${Math.round(c * 100)}%</span>`;
function head() {
  const st = S.structure || {};
  return S.mode === "ai"
    ? `<div class="card"><h3>${esc(st.structure_type || "—")} <span class="chip ai">Gemini + measured</span></h3><div class="note">${esc((st.views || []).join(" · "))}</div><div class="note">${esc(st.summary || "")}</div></div>`
    : `<div class="card"><h3>Geometry engine only <span class="chip">regions · generic names</span></h3><div class="note">The engine found ${S.regions.length} closed regions (the atomic parts). Press <b>✨ Parametrize with Gemini</b> to group them into components, name the values and state what grows and what stays — every claim is measured.</div></div>`;
}
function selectionBar() {
  const changed = JSON.stringify([...hold].sort()) !== JSON.stringify((S.selection.hold || []).slice().sort()) || JSON.stringify([...exclude].sort()) !== JSON.stringify((S.selection.exclude || []).slice().sort()) || JSON.stringify([...drop].sort()) !== JSON.stringify((S.selection.drop || []).slice().sort());
  return `<div class="bar"><button class="primary" id="applySel" ${changed ? "" : "disabled"}>Apply selection</button><button id="allSel">Parametrize entire drawing</button>
    <span class="note">${hold.size} part(s) held · ${exclude.size} value(s) kept as drawn${drop.size ? ` · ${drop.size} constraint(s) dropped` : ""}</span></div>`;
}
function wireSelection() {
  const a = $("#applySel"); if (a) a.onclick = () => run("/api/selection", { selection: { hold: [...hold], exclude: [...exclude], drop: [...drop] } }, "Re-applying your selection…");
  const b = $("#allSel"); if (b) b.onclick = () => { hold.clear(); exclude.clear(); drop.clear(); run("/api/selection", { selection: { hold: [], exclude: [], drop: [] } }, "Parametrizing everything…"); };
}
function renderStruct() {
  const st = S.structure || {};
  let html = head();
  if (S.mode === "ai") {
    const kids = {}; for (const c of S.components) (kids[c.parent && S.components.some((x) => x.name === c.parent) ? c.parent : ""] ||= []).push(c);
    const heldAbove = (c) => { let p = c.parent; while (p) { if (hold.has(p)) return true; p = (S.components.find((x) => x.name === p) || {}).parent; } return false; };
    const node = (c, depth) => {
      const inherited = heldAbove(c);
      return `<div class="node" data-c="${esc(c.name)}" style="padding-left:${6 + depth * 18}px">
        <input type="checkbox" data-hold="${esc(c.name)}" ${hold.has(c.name) || inherited ? "" : "checked"} ${inherited ? "disabled" : ""} title="parametric (untick to keep it as drawn)"/>
        <div class="body"><b>${esc(c.name)}</b> <span class="chip">${esc(c.level)}</span><span class="chip">${esc(c.type)}</span>${conf(c.confidence)}${c.existing ? ' <span class="chip warn">existing</span>' : ""}${c.held ? ' <span class="chip">held</span>' : ""}${!c.parametrize ? ' <span class="chip" title="the AI recommends keeping it as drawn">keep as drawn?</span>' : ""}
          <div class="sub">${c.regions.length ? c.regions.join(" ") : "no regions"}${c.description ? " · " + esc(c.description) : ""}</div>
          ${c.evidence && c.evidence.length ? `<div class="sub">${c.evidence.map(esc).join(" · ")}</div>` : ""}</div></div>` + (kids[c.name] || []).map((k) => node(k, depth + 1)).join("");
    };
    html += `<div class="grp"><span>What to parametrize</span><span>${S.components.length} parts</span></div>` + selectionBar()
      + `<div class="bar"><button id="tellG" title="Turn these ticks into instructions Gemini follows on its next run or revision">Tell Gemini…</button></div>` + (kids[""] || []).map((c) => node(c, 0)).join("");
    const un = (S.intent || {}).uncovered_regions || [];
    if (un.length) html += `<div class="note f-warn">${un.length} region(s) are in no part: ${un.slice(0, 20).join(" ")}</div>`;
  } else {
    html += `<div class="grp"><span>Atomic regions</span><span>${S.regions.length}</span></div>` + selectionBar()
      + S.regions.map((r) => `<div class="node" data-r="${r.id}"><input type="checkbox" data-hold="${r.id}" ${hold.has(r.id) ? "" : "checked"} title="parametric (untick to keep it as drawn)"/><div class="body"><b>${r.id}</b> <span class="sub">${fmt(r.width)} × ${fmt(r.height)}${r.fill ? " · " + esc(r.fill) : ""}${r.parent ? " · inside " + r.parent : ""}</span></div></div>`).join("");
  }
  if ((st.questions || []).length) html += `<div class="grp"><span>Questions for you</span></div>` + st.questions.map((q) => `<div class="note">• ${esc(q)}</div>`).join("");
  html += `<div class="grp"><span>Reading the file</span></div>` + S.reader_notes.map((n) => `<div class="note">${esc(n)}</div>`).join("") + `<div class="note">${S.entities} entities read; not positioned: ${esc(JSON.stringify(S.unsupported))}</div>`;
  $("#pane").innerHTML = html;

};
