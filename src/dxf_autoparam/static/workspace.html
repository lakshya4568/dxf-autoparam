<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sheet Workspace</title>
<style>
  :root {
    --bg: #1b1f27; --panel: #222833; --panel2: #1f2530; --ink: #e5e8ee; --muted: #9aa4b2; --line: #343c4a; --hover: #2c3442;
    --canvas: #161a21; --struct: #e9edf3; --anno: #8fa3bd; --dim: #6fb6ff; --fixed: #465062; --ref: #f08a7a;
    --sel: #ffb020; --hov: #22d3ee; --imp: rgba(34,211,238,.55); --chg: #ff5ab4; --ghost: rgba(233,237,243,.22); --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --accent: #3b82f6; --ai: #a78bfa; --chip: #2b3342; --viewbox: rgba(59,130,246,.55); --table: rgba(74,222,128,.5); --notes: rgba(251,191,36,.45);
    --h-drives: #ff6bd5; --h-follows: #22d3ee; --h-texts: #a78bfa; --h-holds: #4ade80; --h-open: #fbbf24; --h-base: #4f6bff;
  }
  :root[data-theme="light"] {
    --bg: #eef1f5; --panel: #ffffff; --panel2: #f6f8fb; --ink: #1d2430; --muted: #5d6878; --line: #dde2ea; --hover: #eef2f8;
    --canvas: #ffffff; --struct: #111827; --anno: #55657d; --dim: #1d6fd6; --fixed: #c3cad6; --ref: #dc2626;
    --sel: #e07b00; --hov: #0891b2; --imp: rgba(8,145,178,.55); --chg: #d6247f; --ghost: rgba(17,24,39,.18); --chip: #edf1f7;
    --viewbox: rgba(37,99,235,.5); --table: rgba(22,163,74,.45); --notes: rgba(202,138,4,.45);
    --h-drives: #d6247f; --h-follows: #0891b2; --h-texts: #7c3aed; --h-holds: #16a34a; --h-open: #ca8a04;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 12.5px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: grid; grid-template-rows: 40px 1fr 26px; overflow: hidden; }
  header { display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 13px; font-weight: 650; margin: 0 8px 0 0; letter-spacing: .2px; }
  header .file { color: var(--muted); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .sp { flex: 1; }
  button, select, input[type=text], input[type=number] { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line);
         border-radius: 5px; padding: 3px 9px; }
  button { cursor: pointer; } button:hover { background: var(--hover); } button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.icon { padding: 3px 7px; }
  main { display: grid; grid-template-columns: 300px 1fr 330px; min-height: 0; }
  main.noright { grid-template-columns: 300px 1fr 0; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px 4px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .scroll { overflow: auto; flex: 1; min-height: 0; padding: 6px 0 20px; }
  .sec { padding: 8px 10px 3px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; display: flex; align-items: center; gap: 6px; }
  .sec .n { margin-left: auto; text-transform: none; }
  .row { display: flex; align-items: center; gap: 6px; padding: 4px 10px; cursor: pointer; border-left: 2px solid transparent; }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--hover); border-left-color: var(--accent); }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--muted); font-size: 11px; }
  .row .nm.wrap { white-space: normal; } .row .nm.wrap .sub { display: block; line-height: 1.25; }
  .chip { display: inline-block; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--muted); font-size: 10.5px; line-height: 17px; white-space: nowrap; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.ai { color: var(--ai); } .chip.acc { color: var(--accent); }
  .k { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .val { width: 92px; text-align: right; }
  .muted { color: var(--muted); }
  .note { padding: 4px 10px; color: var(--muted); font-size: 11.5px; }
  .note.bad { color: var(--bad); } .note.warn { color: var(--warn); } .note.ok { color: var(--ok); }
  .note.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; white-space: pre-wrap; word-break: break-word; }
  .insp { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .insp h3 { margin: 0; font-size: 13px; }
  .insp .kv { display: grid; grid-template-columns: 96px 1fr; gap: 3px 8px; font-size: 12px; }
  .insp .kv div:nth-child(odd) { color: var(--muted); }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  input[type=range] { width: 100%; }
  #stage { position: relative; min-width: 0; min-height: 0; background: var(--canvas); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); padding: 3px 7px; border-radius: 5px;
         font-size: 11.5px; display: none; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #overlay { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #overlay .chip { background: var(--panel); border: 1px solid var(--line); line-height: 20px; padding: 0 8px; }
  #busy { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.35); color: #fff; font-size: 14px; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--muted); }
  footer { display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
  footer input { background: transparent; border: 0; color: var(--ink); width: 260px; padding: 0; font: 11.5px ui-monospace, Menlo, monospace; }
  footer input:focus { outline: none; }
  footer .msg { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%; }
  footer .msg.bad { color: var(--bad); } footer .msg.ok { color: var(--ok); }
  .preview { border: 1px solid var(--chg); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .grp { margin: 6px 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  textarea { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; resize: vertical; }
  button.stop { background: var(--bad); border-color: var(--bad); color: #fff; }
  .ev { padding: 3px 10px; font-size: 11.5px; border-left: 2px solid transparent; }
  details.fold > summary { cursor: pointer; list-style: none; padding: 8px 10px 4px; color: var(--muted); font-size: 11px; text-transform: uppercase;
         letter-spacing: .6px; display: flex; align-items: center; gap: 6px; user-select: none; }
  details.fold > summary::-webkit-details-marker, details.step > summary::-webkit-details-marker, details.think > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before, details.step > summary::before, details.think > summary::before { content: "▸"; font-size: 9px; transition: transform .12s; }
  details[open] > summary::before { transform: rotate(90deg); }
  details.fold > summary .n { margin-left: auto; text-transform: none; }
  details.fold > summary:hover { color: var(--ink); }
  .hint { margin: 8px 10px; padding: 8px 10px; border-radius: 6px; background: var(--panel2); color: var(--muted); font-size: 11.5px; }
  .hint b { color: var(--ink); }
  .stage3 { display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 8px; align-items: center; padding: 6px 10px; }
  .stage3 .num { width: 18px; height: 18px; border-radius: 9px; background: var(--chip); color: var(--muted); font-size: 10.5px; display: grid; place-items: center; }
  .stage3 .what { font-weight: 600; } .stage3 .why { grid-column: 2 / 4; color: var(--muted); font-size: 11px; margin-top: -2px; }
  .status { margin: 8px 10px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  .status.run { border-color: var(--ai); } .status.fail { border-color: var(--bad); } .status.done { border-color: var(--ok); }
  .status .top { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .status .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--ai); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  details.step { margin: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
  details.step > summary { cursor: pointer; list-style: none; padding: 5px 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
  details.step > summary .lbl { font-weight: 600; } details.step > summary .t { margin-left: auto; color: var(--muted); font-size: 11px; }
  details.step > summary .marks { font-size: 11px; letter-spacing: 1px; }
  details.step.live { border-color: var(--ai); }
  .sbody { padding: 0 8px 7px 20px; display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; }
  .sbody .meta { color: var(--muted); font-size: 10.5px; }
  details.think > summary { cursor: pointer; list-style: none; color: var(--ai); font-size: 11px; display: flex; gap: 5px; align-items: center; }
  details.think .txt { color: var(--muted); font-style: italic; padding: 3px 0 2px 12px; border-left: 2px solid var(--line); margin-top: 3px; white-space: normal; }
  .tool { display: flex; gap: 6px; align-items: baseline; } .tool .m { width: 12px; flex: none; } .tool.ok .m { color: var(--ok); } .tool.no .m { color: var(--bad); }
  .tool code { font: 10.5px ui-monospace, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; }
  .tool .why { color: var(--bad); font-size: 11px; }
  #menu { position: absolute; right: 10px; top: 38px; z-index: 20; display: none; flex-direction: column; gap: 2px; min-width: 210px; padding: 6px;
          background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  #menu.on { display: flex; }
  #menu button, #menu a { text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 5px; color: var(--ink); text-decoration: none; font-size: 12.5px; }
  #menu button:hover, #menu a:hover { background: var(--hover); }
  #menu label { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 8px; }
  .ev.thought { color: var(--muted); font-style: italic; } .ev.call { color: var(--ai); } .ev.done { color: var(--ok); } .ev.error { color: var(--bad); } .ev.stopped { color: var(--warn); }
  kbd { font: 10.5px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

  main.wide { grid-template-columns: 440px 1fr 330px; }
  /* the agent */
  .agent-box { margin: 6px 10px; display: flex; flex-direction: column; gap: 6px; }
  .agent-box textarea { width: 100%; min-height: 96px; }
  .agent-box .row2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .agent-box select { max-width: 100%; }
  button.run { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; padding: 4px 14px; }
  .chip.big { font-size: 11.5px; padding: 1px 9px; }
  .pill { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 10.5px; line-height: 17px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .st-complete, .st-validated, .st-completed { color: var(--ok); } .st-partial, .st-paused, .st-exhausted, .st-awaiting_user, .st-stopped, .st-components_identified { color: var(--warn); }
  .st-bound { color: var(--accent); } .st-found, .st-identified, .st-named, .st-not_analyzed { color: var(--muted); } .st-excluded { color: var(--warn); } .st-unresolved, .st-worked_out { color: var(--bad); }
  .st-failed, .st-refused { color: var(--bad); } .st-running, .st-stopping, .st-analyzing, .st-parametrizing { color: var(--ai); }
  .meter { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; margin-top: 2px; } .meter > i { display: block; height: 100%; background: var(--ai); }
  .meter.warn > i { background: var(--warn); }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
  .crit { display: grid; grid-template-columns: 14px 1fr; gap: 1px 6px; font-size: 11.5px; margin: 2px 0; } .crit .m { text-align: center; }
  .crit.ok .m { color: var(--ok); } .crit.no .m { color: var(--bad); } .crit .d { color: var(--muted); }
  details.plan, details.notes { margin: 6px 0; font-size: 11.5px; } details.plan > summary, details.notes > summary { cursor: pointer; font-weight: 600; }
  .planrow { border-left: 3px solid var(--ok); padding: 2px 0 2px 8px; margin: 4px 0; } .planrow.bad { border-left-color: var(--bad); } .planrow .bad { color: var(--bad); }
  .q { border: 1px solid var(--warn); border-radius: 6px; padding: 6px 8px; margin: 4px 0; display: flex; flex-direction: column; gap: 4px; }
  .q .opts { display: flex; flex-wrap: wrap; gap: 4px; } .q .opts label { border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; cursor: pointer; }
  .q .opts label.on { border-color: var(--accent); background: var(--hover); }
  .turn { margin: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
  .turn > summary { cursor: pointer; list-style: none; padding: 5px 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .turn > summary::-webkit-details-marker { display: none; }
  .turn > summary::before { content: "▸"; font-size: 9px; transition: transform .12s; } .turn[open] > summary::before { transform: rotate(90deg); }
  .turn.live { border-color: var(--ai); }
  .turn > .body { padding: 0 8px 6px 8px; display: flex; flex-direction: column; gap: 5px; }
  .call { display: grid; grid-template-columns: 14px 1fr auto; gap: 1px 6px; align-items: baseline; font-size: 11.5px; }
  .call .m { text-align: center; } .call.ok .m { color: var(--ok); } .call.no .m { color: var(--bad); } .call.run .m { color: var(--ai); animation: pulse 1.2s infinite; }
  .call.wait .m { color: var(--warn); }
  .call .said { grid-column: 2 / 4; color: var(--ink); font-style: italic; } .call .sum { grid-column: 2 / 4; color: var(--muted); }
  .call .bad { grid-column: 2 / 4; color: var(--bad); } .call .ms { color: var(--muted); font-size: 10.5px; }
  .call details { grid-column: 2 / 4; } .call details > summary { cursor: pointer; color: var(--muted); font-size: 10.5px; list-style: none; }
  .call details > summary::-webkit-details-marker { display: none; }
  pre.json { margin: 3px 0 0; padding: 5px 7px; background: var(--bg); border-radius: 5px; font: 10.5px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
  .thumb { grid-column: 2 / 4; } .thumb img { max-width: 100%; max-height: 120px; border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; background: #fff; }
  .sys { margin: 3px 10px; font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; } .sys.bad { color: var(--bad); } .sys.ok { color: var(--ok); } .sys.warn { color: var(--warn); }
  .hist .row .nm { white-space: normal; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
  #modal.on { display: flex; } #modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; max-width: 460px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  #modal .box.pic { max-width: 92vw; max-height: 92vh; overflow: auto; } #modal img { max-width: 100%; background: #fff; }
  .legend { display: grid; grid-template-columns: 16px 1fr auto; gap: 3px 6px; align-items: center; font-size: 12px; }
  .legend i { width: 14px; height: 4px; border-radius: 2px; display: block; } .legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px); height: 3px; }
  .kvs { display: grid; grid-template-columns: 78px 1fr; gap: 2px 8px; font-size: 12px; } .kvs > div:nth-child(odd) { color: var(--muted); }
  .vchip { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 10px; line-height: 15px; background: var(--chip); }
  .vstat { font-size: 10.5px; }
  .lnk { cursor: pointer; text-decoration: underline dotted; color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Sheet Workspace</h1>
  <span class="file" id="file">no drawing</span>
  <button id="open">Open DXF</button><input id="pick" type="file" accept=".dxf" hidden />
  <button class="icon" id="undo" title="Undo (Ctrl/⌘ Z)">↶</button><button class="icon" id="redo" title="Redo (Ctrl/⌘ ⇧ Z)">↷</button>
  <span class="sp"></span>
  <button id="fitall" title="Fit the whole sheet (F)">Fit</button>
  <button class="icon" id="rotcw" title="Turn the view 90° clockwise (R) — the drawing itself is not changed">↻ <span id="rotlbl">0°</span></button>
  <button id="orig" class="icon" title="Show the imported (original) geometry dotted under the current drawing, where it differs">Original ┅</button>
  <button class="primary" id="export" title="Download the edited DXF">Export DXF</button>
  <button class="icon" id="more" title="More">⋯</button>
  <div id="menu">
    <label>Clicks select <select id="filter"><option value="all">everything</option><option value="structure">structure only</option><option value="annotation">annotation only</option></select></label>
    <button id="rotccw">↺ Turn the view counter-clockwise <span class="muted">⇧R</span></button>
    <button id="project">Download the parametric project (.json)</button>
    <label>Original colour <input type="color" id="origcolor" value="#4f6bff"></label>
    <button id="resetdrawing" title="Back to the drawing as imported: values, plans, parametrization, sharing and view corrections">Reset drawing to the imported state…</button>
    <button id="theme">Light / dark theme</button>
    <a href="/classic">Old single-view page</a>
  </div>
</header>
<main id="main">
  <aside>
    <div class="tabs"><button data-tab="sheet" class="on" title="The views found on the sheet">Views</button><button data-tab="params" title="The sizes you can change">Sizes</button><button data-tab="ai" title="Tell the agent what to do — one instruction, it decides the steps">Agent</button><button data-tab="cost" title="Tokens and cost of the model calls, per model">Cost</button></div>
    <div class="scroll" id="left"></div>
  </aside>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay"></div>
    <div id="tip"></div>
    <div id="empty"><div style="font-size:15px">Open a DXF sheet</div><div>its views, tables and notes are found; then name, link and change sizes across views</div><button class="primary" id="open2">Open DXF</button></div>
    <div id="busy">Working…</div>
  </div>
  <aside class="right"><div class="scroll" id="right"></div></aside>
</main>
<div id="modal"><div class="box" id="modalbox"></div></div>
<footer>
  <span>Command:</span><input id="cmd" placeholder="F fit · V view · ESC · UNDO · HELP" />
  <span id="coords">—</span><span id="zoom">—</span><span id="selc">0 selected</span>
  <span class="msg" id="msg"></span>
</footer>
<script>
"use strict";
window.__errors = []; window.addEventListener("error", (e) => window.__errors.push(String(e.message)));
window.addEventListener("unhandledrejection", (e) => window.__errors.push(String(e.reason)));
const $ = (s) => document.querySelector(s);
// An object put into the page is shown as its JSON, never as "[object Object]".
const show = (v) => v == null ? "" : typeof v === "object" ? (() => { try { return JSON.stringify(v); } catch (e) { return String(v); } })() : String(v);
const esc = (s) => show(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const jsonView = (v) => { let t; try { t = JSON.stringify(v, null, 1); } catch (e) { t = String(v); } return `<pre class="json">${esc(t ?? "")}</pre>`; };
const fmt = (v, unit) => v == null ? "" : unit === "m" ? Number(v).toFixed(3) : (Math.round(Number(v) * 10) / 10).toLocaleString("en-US", { maximumFractionDigits: 1 });
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ── state ────────────────────────────────────────────────────────────────────
let S = null;                       // the sheet summary from the server
let P = [];                         // primitives: {i, k, r, l, v, p:Float64Array, c, d, at, t, h, rot}
let byEnt = new Map();              // entity index -> [prim ids]
let grid = null;                    // spatial index over primitives
let cam = { x: 0, y: 0, s: 1, r: 0 };     // world point at the canvas centre, pixels per drawing unit, view rotation (quarter turns)
let sel = new Set(), hov = -1;      // selected entities; hovered entity
let hl = null;                      // the geometry of the value in focus, by category: {drives, follows, texts: Set, holds, open: [{name, set}], show}
let base = { on: false, list: [], rev: -1, color: "#4f6bff", deviation: null };   // the imported geometry of what changed: the dotted layer
let stat = null;                    // /api/sheet/status: how far each view, part and value really is
