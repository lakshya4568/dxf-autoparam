<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sheet Workspace</title>
<style>
  :root {
    --bg: #1b1f27; --panel: #222833; --panel2: #1f2530; --ink: #e5e8ee; --muted: #9aa4b2; --line: #343c4a; --hover: #2c3442;
    --canvas: #161a21; --struct: #e9edf3; --anno: #8fa3bd; --dim: #6fb6ff; --fixed: #465062; --ref: #f08a7a;
    --sel: #ffb020; --hov: #22d3ee; --imp: rgba(34,211,238,.55); --chg: #ff5ab4; --ghost: rgba(233,237,243,.22); --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --accent: #3b82f6; --ai: #a78bfa; --chip: #2b3342; --viewbox: rgba(59,130,246,.55); --table: rgba(74,222,128,.5); --notes: rgba(251,191,36,.45);
  }
  :root[data-theme="light"] {
    --bg: #eef1f5; --panel: #ffffff; --panel2: #f6f8fb; --ink: #1d2430; --muted: #5d6878; --line: #dde2ea; --hover: #eef2f8;
    --canvas: #ffffff; --struct: #111827; --anno: #55657d; --dim: #1d6fd6; --fixed: #c3cad6; --ref: #dc2626;
    --sel: #e07b00; --hov: #0891b2; --imp: rgba(8,145,178,.55); --chg: #d6247f; --ghost: rgba(17,24,39,.18); --chip: #edf1f7;
    --viewbox: rgba(37,99,235,.5); --table: rgba(22,163,74,.45); --notes: rgba(202,138,4,.45);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 12.5px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: grid; grid-template-rows: 40px 1fr 26px; overflow: hidden; }
  header { display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 13px; font-weight: 650; margin: 0 8px 0 0; letter-spacing: .2px; }
  header .file { color: var(--muted); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .sp { flex: 1; }
  button, select, input[type=text], input[type=number] { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line);
         border-radius: 5px; padding: 3px 9px; }
  button { cursor: pointer; } button:hover { background: var(--hover); } button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.icon { padding: 3px 7px; }
  main { display: grid; grid-template-columns: 300px 1fr 330px; min-height: 0; }
  main.noright { grid-template-columns: 300px 1fr 0; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px 4px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .scroll { overflow: auto; flex: 1; min-height: 0; padding: 6px 0 20px; }
  .sec { padding: 8px 10px 3px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; display: flex; align-items: center; gap: 6px; }
  .sec .n { margin-left: auto; text-transform: none; }
  .row { display: flex; align-items: center; gap: 6px; padding: 4px 10px; cursor: pointer; border-left: 2px solid transparent; }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--hover); border-left-color: var(--accent); }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sub { color: var(--muted); font-size: 11px; }
  .chip { display: inline-block; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--muted); font-size: 10.5px; line-height: 17px; white-space: nowrap; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.ai { color: var(--ai); } .chip.acc { color: var(--accent); }
  .k { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .val { width: 92px; text-align: right; }
  .muted { color: var(--muted); }
  .note { padding: 4px 10px; color: var(--muted); font-size: 11.5px; }
  .note.bad { color: var(--bad); } .note.warn { color: var(--warn); } .note.ok { color: var(--ok); }
  .insp { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .insp h3 { margin: 0; font-size: 13px; }
  .insp .kv { display: grid; grid-template-columns: 96px 1fr; gap: 3px 8px; font-size: 12px; }
  .insp .kv div:nth-child(odd) { color: var(--muted); }
  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  input[type=range] { width: 100%; }
  #stage { position: relative; min-width: 0; min-height: 0; background: var(--canvas); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); padding: 3px 7px; border-radius: 5px;
         font-size: 11.5px; display: none; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  #overlay { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  #overlay .chip { background: var(--panel); border: 1px solid var(--line); line-height: 20px; padding: 0 8px; }
  #busy { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.35); color: #fff; font-size: 14px; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--muted); }
  footer { display: flex; align-items: center; gap: 14px; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
  footer input { background: transparent; border: 0; color: var(--ink); width: 260px; padding: 0; font: 11.5px ui-monospace, Menlo, monospace; }
  footer input:focus { outline: none; }
  footer .msg { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%; }
  footer .msg.bad { color: var(--bad); } footer .msg.ok { color: var(--ok); }
  .preview { border: 1px solid var(--chg); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .grp { margin: 6px 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  textarea { font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; resize: vertical; }
  button.stop { background: var(--bad); border-color: var(--bad); color: #fff; }
  .ev { padding: 3px 10px; font-size: 11.5px; border-left: 2px solid transparent; }
  .ev.thought { color: var(--muted); font-style: italic; } .ev.call { color: var(--ai); } .ev.done { color: var(--ok); } .ev.error { color: var(--bad); } .ev.stopped { color: var(--warn); }
  kbd { font: 10.5px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <h1>Sheet Workspace</h1>
  <span class="file" id="file">no drawing</span>
  <button id="open">Open DXF</button><input id="pick" type="file" accept=".dxf" hidden />
  <button class="icon" id="undo" title="Undo (Ctrl/⌘ Z)">↶</button><button class="icon" id="redo" title="Redo (Ctrl/⌘ ⇧ Z)">↷</button>
  <span class="sp"></span>
  <select id="filter" title="What a click or a box selects"><option value="all">Select: all</option><option value="structure">Structure only</option><option value="annotation">Annotation only</option></select>
  <button id="fitall" title="Fit the sheet (F)">Fit</button>
  <button class="icon" id="rotccw" title="Rotate the view 90° counter-clockwise (Shift R)">⟲</button><span class="muted" id="rotlbl" style="min-width:2.4em;text-align:center">0°</span><button class="icon" id="rotcw" title="Rotate the view 90° clockwise (R)">⟳</button>
  <button id="project" title="Download the parametric project (JSON)">Project</button>
  <button class="primary" id="export" title="Download the edited DXF">Export DXF</button>
  <button class="icon" id="theme" title="Light / dark">◐</button>
  <a href="/classic" class="muted" style="margin-left:4px" title="The single-view page with the Gemini panel">classic</a>
</header>
<main id="main">
  <aside>
    <div class="tabs"><button data-tab="sheet" class="on">Sheet</button><button data-tab="params">Parameters</button><button data-tab="review">Review</button><button data-tab="ai">Gemini</button></div>
    <div class="scroll" id="left"></div>
  </aside>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="overlay"></div>
    <div id="tip"></div>
    <div id="empty"><div style="font-size:15px">Open a DXF sheet</div><div>its views, tables and notes are found; then name, link and change sizes across views</div><button class="primary" id="open2">Open DXF</button></div>
    <div id="busy">Working…</div>
  </div>
  <aside class="right"><div class="scroll" id="right"></div></aside>
</main>
<footer>
  <span>Command:</span><input id="cmd" placeholder="F fit · V view · ESC · UNDO · HELP" />
  <span id="coords">—</span><span id="zoom">—</span><span id="selc">0 selected</span>
  <span class="msg" id="msg"></span>
</footer>
<script>
"use strict";
window.__errors = []; window.addEventListener("error", (e) => window.__errors.push(String(e.message)));
window.addEventListener("unhandledrejection", (e) => window.__errors.push(String(e.reason)));
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (v, unit) => v == null ? "" : unit === "m" ? Number(v).toFixed(3) : (Math.round(Number(v) * 10) / 10).toLocaleString("en-US", { maximumFractionDigits: 1 });
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ── state ────────────────────────────────────────────────────────────────────
let S = null;                       // the sheet summary from the server
let P = [];                         // primitives: {i, k, r, l, v, p:Float64Array, c, d, at, t, h, rot}
let byEnt = new Map();              // entity index -> [prim ids]
let grid = null;                    // spatial index over primitives
let cam = { x: 0, y: 0, s: 1, r: 0 };     // world point at the canvas centre, pixels per drawing unit, view rotation (quarter turns)
let sel = new Set(), hov = -1;      // selected entities; hovered entity
let impact = new Set();             // what the value in focus moves (measured)
let focus = null;                   // { kind: "view"|"param"|"entity"|"unit", id }
let activeView = null;              // a view the canvas dims the others for
let unitCache = new Map();          // unit id -> /api/sheet/unit
const loading = new Set();          // units being analysed
let paramInfo = null;               // /api/sheet/param of the parameter in focus
let preview = null;                 // { changes, res, prims:Map(entity -> prims) }
let tab = "sheet";
let mode = null;                    // null | "split"
let theme = (() => { try { return localStorage.getItem("ws-theme") || "dark"; } catch (e) { return "dark"; } })();
document.documentElement.dataset.theme = theme;

// ── server ───────────────────────────────────────────────────────────────────
async function api(path, body, method) {
  const opt = body === undefined ? { method: method || "GET" } : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ ok: false, error: `HTTP ${r.status}` }));
  if (!r.ok || j.ok === false) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function busy(on, text) { $("#busy").style.display = on ? "flex" : "none"; $("#busy").textContent = text || "Working…"; }
function say(text, kind) { const m = $("#msg"); m.textContent = text; m.className = "msg " + (kind || ""); }
async function guard(fn, text) { try { if (text) busy(true, text); return await fn(); } catch (e) { say(e.message, "bad"); } finally { busy(false); } }

// ── geometry ─────────────────────────────────────────────────────────────────
function ingest(prims) {
  const out = [];
  for (const q of prims) {
    const o = { i: q.i, k: q.k, r: q.r, l: q.l, v: q.v, c: !!q.c, d: !!q.d };
    if (q.p) o.p = Float64Array.from(q.p);
    if (q.k === "t") { o.at = q.at; o.t = q.t; o.h = q.h || 0; o.rot = q.rot || 0; o.ha = q.ha; o.va = q.va; o.wf = q.wf; o.ls = q.ls; }
    o.b = bboxOf(o);
    out.push(o);
  }
  return out;
}
function bboxOf(o) {
  if (o.k === "t") { const h = o.h || 1, w = Math.max(1, (o.t || "").split("\n").reduce((m, s) => Math.max(m, s.length), 0)) * 0.62 * h;
    const r = Math.max(w, h * 1.6 * Math.max(1, (o.t || "").split("\n").length)); return [o.at[0] - r, o.at[1] - r, o.at[0] + r, o.at[1] + r]; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let k = 0; k < o.p.length; k += 2) { const x = o.p[k], y = o.p[k + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return [x0, y0, x1, y1];
}
function buildIndex() {
  byEnt = new Map();
  P.forEach((o, n) => { if (!byEnt.has(o.i)) byEnt.set(o.i, []); byEnt.get(o.i).push(n); });
  const ext = sheetBox();
  const W = ext[2] - ext[0] || 1, H = ext[3] - ext[1] || 1, cell = Math.max(W, H) / 220;
  const nx = Math.ceil(W / cell) + 1, ny = Math.ceil(H / cell) + 1;
  const cells = new Map(), big = [];
  P.forEach((o, n) => {
    const b = o.b; const c0 = Math.floor((b[0] - ext[0]) / cell), c1 = Math.floor((b[2] - ext[0]) / cell);
    const r0 = Math.floor((b[1] - ext[1]) / cell), r1 = Math.floor((b[3] - ext[1]) / cell);
    if ((c1 - c0 + 1) * (r1 - r0 + 1) > 400) { big.push(n); return; }
    for (let r = Math.max(0, r0); r <= Math.min(ny - 1, r1); r++) for (let c = Math.max(0, c0); c <= Math.min(nx - 1, c1); c++) {
      const key = r * nx + c; let a = cells.get(key); if (!a) { a = []; cells.set(key, a); } a.push(n);
    }
  });
  grid = { ext, cell, nx, ny, cells, big, stamp: new Int32Array(P.length), frame: 1 };
}
function sheetBox() {
  if (S && S.frame) return S.frame;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const o of P) { if (o.r === "fixed") continue; x0 = Math.min(x0, o.b[0]); y0 = Math.min(y0, o.b[1]); x1 = Math.max(x1, o.b[2]); y1 = Math.max(y1, o.b[3]); }
  return isFinite(x0) ? [x0, y0, x1, y1] : [0, 0, 1, 1];
}
function query(x0, y0, x1, y1, list) {   // prim ids whose cells meet the box (each once)
  const g = grid; if (!g) return [];
  g.frame++; const out = list || [];
  const c0 = Math.max(0, Math.floor((x0 - g.ext[0]) / g.cell)), c1 = Math.min(g.nx - 1, Math.floor((x1 - g.ext[0]) / g.cell));
  const r0 = Math.max(0, Math.floor((y0 - g.ext[1]) / g.cell)), r1 = Math.min(g.ny - 1, Math.floor((y1 - g.ext[1]) / g.cell));
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) { const a = g.cells.get(r * g.nx + c); if (!a) continue;
    for (const n of a) if (g.stamp[n] !== g.frame) { g.stamp[n] = g.frame; out.push(n); } }
  for (const n of g.big) if (g.stamp[n] !== g.frame) { g.stamp[n] = g.frame; out.push(n); }
  return out;
}

// ── camera ───────────────────────────────────────────────────────────────────
const cv = $("#cv"); const ctx = cv.getContext("2d");
let dpr = 1, CW = 1, CH = 1;
let fitted = false;   // the first fit waits until the canvas has a size
function resize() { dpr = window.devicePixelRatio || 1; const r = cv.getBoundingClientRect(); CW = r.width; CH = r.height;
  cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
  if (!fitted && P.length && CW > 50 && CH > 50) { fitted = true; fit(sheetBox(), 0.03); } else draw(); }
new ResizeObserver(resize).observe($("#stage"));
// The view turns in quarter turns only, so a screen rectangle stays an axis-aligned box in the drawing (window and
// crossing selection stay exact). The drawing itself is never changed: rotation is the camera's.
const rot = () => { const a = (((cam.r % 4) + 4) % 4) * Math.PI / 2; return [Math.round(Math.cos(a)), Math.round(Math.sin(a))]; };
const toScreen = (x, y) => { const [c, n] = rot(), dx = x - cam.x, dy = y - cam.y;
  return [(dx * c - dy * n) * cam.s + CW / 2, CH / 2 - (dx * n + dy * c) * cam.s]; };
const toWorld = (sx, sy) => { const [c, n] = rot(), rx = (sx - CW / 2) / cam.s, ry = (CH / 2 - sy) / cam.s;
  return [cam.x + rx * c + ry * n, cam.y - rx * n + ry * c]; };
function rotateView(q) { cam.r = (((cam.r + q) % 4) + 4) % 4; $("#rotlbl").textContent = cam.r * 90 + "°"; say(`view rotated to ${cam.r * 90}°`); draw(); }
function fit(box, pad = 0.06) {
  if (!box) return; let w = box[2] - box[0] || 1, h = box[3] - box[1] || 1;
  if (cam.r % 2) [w, h] = [h, w];
  cam.s = Math.min(CW / (w * (1 + 2 * pad)), CH / (h * (1 + 2 * pad))); cam.x = (box[0] + box[2]) / 2; cam.y = (box[1] + box[3]) / 2; draw();
}
function viewBox(gid) { const g = S.groups.find((x) => x.id === gid); return g ? g.bbox : null; }
function entBox(ents) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const i of ents) for (const n of byEnt.get(i) || []) { const b = P[n].b; x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]); }
  return isFinite(x0) ? [x0, y0, x1, y1] : null; }

// ── drawing ──────────────────────────────────────────────────────────────────
let raf = 0;
function draw() { if (!raf) raf = requestAnimationFrame(render); }
let lastFrameMs = 0;
function render() {
  raf = 0; const t0 = performance.now();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = css("--canvas"); ctx.fillRect(0, 0, CW, CH);
  if (!P.length) return;
  const [ax, ay] = toWorld(0, 0), [bx, by] = toWorld(CW, CH);
  const wx0 = Math.min(ax, bx), wx1 = Math.max(ax, bx), wy0 = Math.min(ay, by), wy1 = Math.max(ay, by);
  const ids = query(wx0, wy0, wx1, wy1, []);
  const furniture = S ? new Set([...S.furniture.frame, ...S.furniture.rules, ...S.furniture.watermark, ...S.furniture.stray]) : new Set();
  const changed = preview ? preview.ents : null;
  const colors = { s: css("--struct"), a: css("--anno"), d: css("--dim"), f: css("--fixed"), ref: css("--ref"), sel: css("--sel"), hov: css("--hov"), chg: css("--chg"), ghost: css("--ghost") };
  const groups = { s: [], a: [], d: [], f: [], ref: [], dimmed: [], fill: [] };
  const tiny = 1.2 / cam.s;
  for (const n of ids) {
    const o = P[n];
    if (changed && changed.has(o.i)) continue;   // drawn from the preview below
    if (o.k === "t") continue;
    const b = o.b; if (b[2] - b[0] < tiny && b[3] - b[1] < tiny && o.k !== "g") continue;  // smaller than a pixel
    let key = furniture.has(o.i) || o.r === "fixed" ? "f" : o.d ? "d" : o.r === "reference" ? "ref" : o.r === "structural" ? "s" : "a";
    if (activeView && o.v !== activeView && key !== "f") key = "dimmed";
    if (o.k === "g") { if (key !== "dimmed") groups.fill.push(o); continue; }
    groups[key].push(o);
  }
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  // hatch / solid fills, faint
  if (groups.fill.length) { ctx.fillStyle = theme === "light" ? "rgba(99,102,241,.10)" : "rgba(129,140,248,.12)"; ctx.beginPath(); for (const o of groups.fill) poly(o.p, true); ctx.fill(); }
  stroke(groups.dimmed, theme === "light" ? "rgba(120,130,150,.35)" : "rgba(150,160,180,.22)", 1);
  stroke(groups.f, colors.f, 1); stroke(groups.a, colors.a, 1); stroke(groups.d, colors.d, 1); stroke(groups.ref, colors.ref, 1, [6, 4]); stroke(groups.s, colors.s, 1.15);
  texts(ids, furniture, colors);
  if (preview) {   // the original faint and dashed, the proposal bright
    const ghost = []; for (const i of preview.ents) for (const n of byEnt.get(i) || []) if (P[n].k !== "t") ghost.push(P[n]);
    stroke(ghost, colors.ghost, 1, [4, 3]);
    const now = []; for (const list of preview.prims.values()) for (const o of list) if (o.k !== "t") now.push(o);
    stroke(now, colors.chg, 1.6);
    ctx.fillStyle = colors.chg; for (const list of preview.prims.values()) for (const o of list) if (o.k === "t") text1(o);
  }
  // what the value in focus moves (lighter than a selection; hidden while a preview shows the change itself)
  if (impact.size && !preview) { const ip = []; for (const i of impact) for (const n of byEnt.get(i) || []) if (P[n].k !== "t") ip.push(P[n]); stroke(ip, css("--imp"), 1.8); }
  // selection and hover on top
  const selP = []; for (const i of sel) for (const n of byEnt.get(i) || []) if (P[n].k !== "t") selP.push(P[n]);

  if (rng) h += `<input type="range" id="pslide" min="${rng.min}" max="${rng.max}" step="${(rng.max - rng.min) / 400}" value="${cur}"><div class="muted">valid ${fmt(rng.min)} … ${fmt(rng.max)} <span title="${esc((rng.min_reason || "") + "\n" + (rng.max_reason || ""))}">ⓘ</span></div>`;
  if (preview && preview.res) { const r = preview.res;
    h += r.ok ? `<div class="note ok" style="padding:0">${r.changed} entities change · ${Object.entries(r.by_view).filter(([k]) => k).map(([k, n]) => `${esc(k)} ${n}`).join(" · ")}</div>`
              : `<div class="note bad" style="padding:0">${r.errors.slice(0, 4).map(esc).join("<br>")}</div>`;
    if (r.warnings && r.warnings.length) h += `<div class="note warn" style="padding:0">${r.warnings.slice(0, 5).map(esc).join("<br>")}</div>`; }
  h += `</div>`;
  if (!info) return h + `<div class="muted">measuring what it moves…</div></div>`;
  const imp = info.impact;
  h += `<div class="sec" style="padding:0">What it moves (measured)</div><div class="kv"><div>views</div><div>${imp.views.map((v) => `<span class="chip acc">${esc(v)}</span>`).join(" ") || "—"}</div>
    <div>entities</div><div>${imp.entities}</div><div>stays</div><div class="muted">${imp.stays.length} other view(s) unchanged</div></div>`;
  for (const [u, parts] of Object.entries(imp.parts || {})) if (parts.length) h += `<div class="muted">${esc(u)} parts: ${parts.map(esc).join(", ")}</div>`;
  h += `<div class="sec" style="padding:0">How it grows</div>`;
  for (const g of info.growth) h += `<div class="bar"><span class="chip">${esc(g.unit || "")}</span><span>${esc(g.why)}</span>${g.unit ? `<select data-anchor="${esc(g.unit)}">${["start", "end", "centre"].map((m) => `<option value="${m}" ${g.mode === m ? "selected" : ""}>${m === "start" ? "start stays" : m === "end" ? "end stays" : "about centre"}</option>`).join("")}${["start", "end", "centre"].includes(g.mode) ? "" : `<option selected disabled>${esc(g.mode)}</option>`}</select>` : ""}</div>`;
  if (shared) { h += `<div class="sec" style="padding:0">Bound in</div>`;
    for (const b of shared.bindings) h += `<div class="note" style="padding:0"><span class="chip ${b.status === "drives" ? "ok" : "warn"}">${esc(b.status)}</span> ${esc(b.unit)} (${esc(b.views.join("+"))}) ${esc(b.reason || "")}</div>`;
    for (const e of shared.evidence || []) h += `<div class="note" style="padding:0">· ${esc(e)}</div>`;
    h += `<div class="bar"><button id="punshare">Stop sharing</button></div>`; }
  return h + `</div>`;
}
function wireParam() {
  const key = focus.id; const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
  on("#pval", "keydown", (e) => { if (e.key === "Enter") { const v = parseNum(e.target.value); if (v != null) startPreview({ [key]: v }, false); } });
  on("#pval", "change", (e) => { const v = parseNum(e.target.value); if (v != null) startPreview({ [key]: v }, false); });
  on("#pslide", "input", (e) => {   // the slider lands on whole, round sizes (a draftsman's value), never 1723.391
    const r = Number(e.target.max) - Number(e.target.min), step = r > 2000 ? 10 : r > 200 ? 5 : r > 20 ? 1 : 0.1;
    const v = Math.min(Math.max(Math.round(Number(e.target.value) / step) * step, Number(e.target.min)), Number(e.target.max));
    $("#pval").value = +v.toFixed(3); startPreview({ [key]: v }, false); });
  on("#papply", "click", () => preview ? applyPreview() : (() => { const v = parseNum($("#pval").value); if (v != null) startPreview({ [key]: v }, true); })());
  on("#pcancel", "click", cancelPreview);
  on("#prename", "click", () => { const nn = $("#pname").value.trim(); const old = key; edit("rename", { old, new: nn }, () => openParam(S.shared.some((p) => p.name === nn) ? nn : `${old.split(".")[0]}.${nn}`)); });
  on("#punshare", "click", () => edit("unshare", { name: key }, () => { focus = null; renderRight(); }));
  document.querySelectorAll("#right [data-anchor]").forEach((el) => el.addEventListener("change", () => edit("anchor", { name: key, unit: el.dataset.anchor, mode: el.value }, () => openParam(key))));
}
async function loadProposals() {
  const res = await guard(() => api("/api/sheet/proposals"), "Comparing the views…"); if (!res) return;
  $("#propn").textContent = res.proposals.length;
  $("#props").innerHTML = res.proposals.length ? res.proposals.map((p, k) => `<div class="grp"><b>${fmt(p.value)}</b> mm · ${esc(p.views[0].join("+"))} ↔ ${esc(p.views[1].join("+"))}
     <div class="muted">${p.evidence.map(esc).join("<br>")}</div><div class="bar"><input type="text" placeholder="PascalCase name" data-pn="${k}" style="flex:1"><button data-pk="${k}">Share</button></div></div>`).join("")
    : `<div class="note">No size is stated by two separate views.</div>`;
  document.querySelectorAll("#props [data-pk]").forEach((b) => b.addEventListener("click", () => { const p = res.proposals[+b.dataset.pk]; const name = document.querySelector(`#props [data-pn="${b.dataset.pk}"]`).value.trim();
    if (!name) return say("give it a PascalCase name", "bad"); edit("share", { name, targets: [p.a, p.b], evidence: p.evidence, source: "proposal" }, () => { tab = "params"; setTab(); openParam(name); }); }));
}

// ── Gemini ───────────────────────────────────────────────────────────────────
let ai = { running: false, events: [], next: 0, result: null, error: null, kind: null }, aiDraft = "", aiPoll = 0;
function geminiPanel() {
  const uid = activeUnit(); const u = uid && S.units.find((x) => x.id === uid);
  let h = `<div class="sec">Gemini on this sheet</div>
    <div class="note">Every run is billed. The engine checks all it proposes: ids, values, lines; what does not hold is refused and said, what holds can be undone.</div>
    <div class="note"><textarea id="ai-instr" rows="3" style="width:100%" placeholder="Your instructions, e.g. the left half is the existing structure: keep it as drawn">${esc(aiDraft)}</textarea></div>
    <div class="note"><b>1</b> Name, type and relate the views</div><div class="bar" style="padding:0 10px 6px"><button id="ai-views" ${ai.running ? "disabled" : ""}>Understand the views</button></div>
    <div class="note"><b>2</b> Parametrize one unit (the agent, small checked edits)</div><div class="bar" style="padding:0 10px 6px"><button id="ai-unit" ${ai.running || !u ? "disabled" : ""}>${u ? "Parametrize " + esc(u.views.join(" + ")) : "open a view first"}</button></div>
    <div class="note"><b>3</b> Name the sizes separate views share</div><div class="bar" style="padding:0 10px 6px"><button id="ai-shared" ${ai.running ? "disabled" : ""}>Link sizes across views</button></div>
    ${ai.running ? `<div class="bar" style="padding:0 10px"><button class="stop" id="ai-stop">■ Stop Gemini</button><span class="muted">${esc(ai.kind || "")} running…</span></div>` : ""}`;
  if (ai.result) {
    const r = ai.result;
    h += `<div class="sec">Result</div>`;
    for (const a of r.applied || []) h += `<div class="note ok">✓ ${esc(a)}</div>`;
    for (const a of r.refused || []) h += `<div class="note bad">✗ ${esc(a)}</div>`;
    for (const q of r.questions || []) h += `<div class="note warn">? ${esc(q)}</div>`;
    if (r.named != null) h += `<div class="note ok">✓ ${r.named} named values in ${esc(r.unit)}${r.rejected && Object.keys(r.rejected).length ? " · refused: " + esc(JSON.stringify(r.rejected)) : ""}</div>`;
    if (r.usage && r.usage.model) h += `<div class="note">${esc(r.usage.model)} @${esc(r.usage.thinking)} · in ${r.usage.input_tokens || 0} · out ${(r.usage.output_tokens || 0) + (r.usage.thinking_tokens || 0)} tokens${r.usage.cached ? " · from cache (free)" : ""}</div>`;
  }
  if (ai.error) h += `<div class="note bad">${esc(ai.error)}</div>`;
  h += `<div class="sec">Progress <span class="n">${ai.events.length}</span></div>`;
  for (const e of ai.events.slice(-120)) h += `<div class="ev ${esc(e.kind)}">${e.t != null ? `<span class="muted">${e.t}s</span> ` : ""}${e.kind === "call" ? `${esc(e.label || "")} · ${esc(e.model || "")} @${esc(e.thinking || "")}${e.prompt_cache ? " · cache " + esc(e.prompt_cache) : ""}` : esc(e.text || e.kind)}</div>`;
  return h;
}
function wireGemini() {
  const t = $("#ai-instr"); if (t) t.addEventListener("input", () => { aiDraft = t.value; });
  const go = (kind, body) => guard(async () => { await api(`/api/sheet/ai/${kind}`, body); ai = { running: true, events: [], next: 0, result: null, error: null, kind }; renderLeft(); pollAI(); });
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("#ai-views", () => go("views", {}));
  on("#ai-unit", () => go("unit", { unit: activeUnit(), instructions: aiDraft }));
  on("#ai-shared", () => go("shared", {}));
  on("#ai-stop", () => guard(() => api("/api/sheet/ai/stop", {})));
}
function pollAI() {
  clearTimeout(aiPoll);
  aiPoll = setTimeout(async () => {
    let r; try { r = await api(`/api/sheet/ai/progress?since=${ai.next}`); } catch (e) { say(e.message, "bad"); return; }
    ai.events.push(...r.events); ai.next = r.next; ai.running = r.running; ai.error = r.error; ai.kind = r.kind;
    if (!r.running) { ai.result = r.result; S = await api("/api/sheet"); unitCache.clear(); renderRight(); draw();
      say(r.error ? "Gemini: " + r.error : "Gemini finished — review what it applied (undo takes it back)", r.error ? "bad" : "ok"); }
    if (tab === "ai") renderLeft();
    if (r.running) pollAI();
  }, 800);
}

// ── file, tabs, theme ────────────────────────────────────────────────────────
async function loadSheet() {
  const s = await api("/api/sheet"); if (s.empty) { $("#empty").style.display = "flex"; return; }
  S = s; $("#empty").style.display = "none"; $("#file").textContent = S.file;
  const g = await guard(async () => { const t0 = performance.now(); const r = await fetch("/api/sheet/geometry"); const j = await r.json(); return { j, ms: performance.now() - t0 }; }, "Loading the sheet…");
  if (!g) return;
  P = ingest(g.j.prims); buildIndex(); tidyAll();
  sel = new Set(); hov = -1; focus = null; activeView = null; preview = null; unitCache.clear();
  $("#undo").disabled = !S.can_undo; $("#redo").disabled = !S.can_redo;
  if (S.ai_running) { ai = { running: true, events: [], next: 0, result: null, error: null, kind: null }; pollAI(); }
  renderLeft(); renderRight(); fitted = false; resize();
  say(`${S.entities.toLocaleString()} entities · ${S.groups.filter((x) => x.kind === "view").length} views · loaded in ${Math.round(g.ms)} ms`, "ok");
}
async function openFile(f) {
  const r = await guard(async () => { const res = await fetch(`/api/sheet/open?name=${encodeURIComponent(f.name)}`, { method: "POST", body: await f.arrayBuffer() });
    const j = await res.json(); if (!res.ok || j.ok === false) throw new Error(j.error || "could not open"); return j; }, `Reading ${f.name}…`);
  if (r) await loadSheet();
}
function setTab() { document.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab)); renderLeft(); }
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; setTab(); }));
$("#open").onclick = $("#open2").onclick = () => $("#pick").click();
$("#pick").onchange = (e) => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ""; };
$("#undo").onclick = undo; $("#redo").onclick = redo; $("#fitall").onclick = () => fit(sheetBox());
$("#filter").onchange = () => { hov = -1; draw(); };
$("#theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = theme; try { localStorage.setItem("ws-theme", theme); } catch (e) { /* private window */ } draw(); };
async function download(url, fallback) {
  await guard(async () => { const r = await fetch(url); if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || `HTTP ${r.status}`); }
    const blob = await r.blob(); const a = document.createElement("a"); const cd = r.headers.get("Content-Disposition") || "";
    a.download = (cd.match(/filename="([^"]+)"/) || [])[1] || fallback; a.href = URL.createObjectURL(blob); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, "Preparing…");
}
$("#export").onclick = () => download("/api/sheet/export", "sheet.dxf");
$("#project").onclick = () => download("/api/sheet/project", "sheet.autoparam.json");
$("#rotcw").addEventListener("click", () => rotateView(-1)); $("#rotccw").addEventListener("click", () => rotateView(1));
window.__ws = { tidyAll, get labels() { return P.filter((o) => o.k === "t" && o.off).length; }, rotateView, toScreen, toWorld,  get prims() { return P.length; }, get frameMs() { return lastFrameMs; }, fit, draw, pick, boxSelect, cam, sheet: () => sheetBox(), render: () => { render(); return lastFrameMs; } };
loadSheet().catch((e) => say(e.message, "bad"));
